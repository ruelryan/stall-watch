name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    env:
      # Placeholders so `next build` can evaluate the env; no real project is contacted.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  db:
    name: Migrations, seed and pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # `supabase start` applies every migration and seed.sql to a fresh local Postgres,
      # which is the same rebuild-from-repo check the reviewers do.
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
